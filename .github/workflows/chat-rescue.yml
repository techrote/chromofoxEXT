name: Conversation Rescue smoke
on:
  pull_request:
    paths:
      - "extensions/chat-rescue/**"
      - ".github/workflows/chat-rescue.yml"
  push:
    paths:
      - "extensions/chat-rescue/**"
      - ".github/workflows/chat-rescue.yml"
permissions:
  contents: read
jobs:
  node-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build both browser packages and check syntax
        working-directory: extensions/chat-rescue
        run: |
          node build.mjs
          node --check src/logic.js
          node --check src/content.js
          node --check src/popup.js
      - name: Node logic, safety and manifest tests
        working-directory: extensions/chat-rescue
        run: node --test tests/*.test.mjs
      - name: Install isolated Chromium browser test dependencies
        run: |
          python -m pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Simulated stuck-chat browser smoke (no ChatGPT network)
        working-directory: extensions/chat-rescue
        run: python tests/browser-smoke.py
