name: Browser extension archive smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify exact archival source blobs
        run: python scripts/check_source_integrity.py
      - name: Test Firefox Actions Jumper
        run: node --test firefox/actions-jumper-v2/tests/*.test.cjs
      - name: Test Firefox Message Timestamps
        run: node --test firefox/chatgpt-timestamps/tests/*.test.js
      - name: Test Firefox ChatGPT Tab Signal
        run: node --test firefox/chatgpt-tab-signal/tests/*.test.js
      - name: Validate Chrome QOL suite manifest and assets
        run: python chrome/chatGPTchromeQOL/chatgpt-qol-suite/tests/test_manifest.py

  chrome-suite-fixture:
    # Keep this original-source archive byte-identical; exercise the archived
    # Chromium suite in a separate offline CI job rather than modifying it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline Chromium integration test dependencies
        run: |
          python -m pip install "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Test archived Chrome QOL suite against local fixture
        run: python chrome/chatGPTchromeQOL/chatgpt-qol-suite/tests/test_suite.py
