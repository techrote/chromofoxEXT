<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Actions Jumper</title></head>
<body class="popup">
<header><b>Actions Jumper</b><button id="settings" title="Settings" aria-label="Settings">⚙</button></header>
<form id="jumpForm" autocomplete="off">
<label for="repo">Repository · <span id="ownerLabel">techrote</span></label>
<input id="repo" role="combobox" aria-autocomplete="list" aria-controls="suggestions" aria-expanded="false" placeholder="Type repo name…" spellcheck="false" autofocus>
<ul id="suggestions" role="listbox" hidden></ul>
<label for="filter">Actions filter</label>
<select id="filter"></select>
<button class="primary" type="submit">Open Actions ↗</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<script src="popup.js"></script>
</body></html>
