<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message timestamps</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="eyebrow">CHATGPT / LOCAL</div>
    <h1>Message timestamps</h1>
    <p>Record when messages are sent and when replies first appear.</p>
  </header>
  <main>
    <div class="count"><strong id="count">—</strong><span>saved timestamps</span></div>
    <label class="option"><span><strong>Display timestamps</strong><small>Continue recording while hidden</small></span><input id="enabled" type="checkbox"></label>
    <label class="option"><span><strong>Show seconds</strong><small>Include hh:mm:ss in each label</small></span><input id="showSeconds" type="checkbox"></label>
    <label class="option"><span><strong>Mark older messages</strong><small>Use clearly marked “First seen” times, not guessed creation times</small></span><input id="firstSeen" type="checkbox"></label>
    <div class="actions">
      <button id="export" type="button">Export JSON</button>
      <button id="import" type="button">Import JSON</button>
      <input id="file" type="file" accept=".json,application/json" hidden>
    </div>
    <button id="clear" class="danger" type="button">Delete saved timestamps</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <footer>Stored only in this Firefox profile. No message text, analytics or network requests.</footer>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
